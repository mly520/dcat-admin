name: CI

on:
  push:
    branches: [ 3.0, 2.0 ]
  pull_request:
    branches: [ 3.0, 2.0 ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # Laravel 11 已 EOL,全部版本带未修复安全公告,composer 默认拒绝安装,故不在 CI 中测试
        laravel: ['12', '13']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - testbench + phpstan

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run unit tests (testbench)
        run: vendor/bin/phpunit -c phpunit.xml

      - name: Run static analysis (phpstan)
        run: vendor/bin/phpstan analyse --memory-limit=1G
